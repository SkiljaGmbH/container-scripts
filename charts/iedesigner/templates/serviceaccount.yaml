{{- if and .Values.enabled .Values.serviceAccount.create (not .Values.serviceAccount.name) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "extraction-designer.fullname" . }}
  labels:
    {{- include "extraction-designer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

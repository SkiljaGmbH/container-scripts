{{- if .Values.enabled }}
{{- $needsDb := not .Values.global.database.existingSecret }}
{{- $needsDp := and .Values.config.dataProtection.certificatePassword (not .Values.config.dataProtection.existingSecret) }}
{{- if or $needsDb $needsDp }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "validationservice.fullname" . }}-secrets
  labels:
    {{- include "validationservice.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsDb }}
  database-password: {{ required "global.database.password must be set (or use global.database.existingSecret)" .Values.global.database.password | quote }}
  {{- end }}
  {{- if $needsDp }}
  dataprotection-certificate-password: {{ .Values.config.dataProtection.certificatePassword | quote }}
  {{- end }}
{{- end }}
{{- end }}

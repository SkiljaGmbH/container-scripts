{{- if or .Values.enabled .Values.auth.autoCreateAuthClients }}
{{- $name := printf "%s-secrets" (include "classification-monitor.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $clientSecret := .Values.auth.serverClientSecret }}
{{- if not $clientSecret }}
  {{- if and $existing $existing.data (hasKey $existing.data "classificationmonitor-client-secret") }}
    {{- $clientSecret = index $existing.data "classificationmonitor-client-secret" | b64dec }}
  {{- else }}
    {{- $clientSecret = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "classification-monitor.fullname" . }}-secrets
  labels:
    {{- include "classification-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.global.database.existingSecret }}
  database-password: {{ .Values.global.database.password | quote }}
  {{- end }}
  {{- if not .Values.auth.existingServerClientSecret }}
  classificationmonitor-client-secret: {{ $clientSecret | quote }}
  {{- end }}
{{- end }}

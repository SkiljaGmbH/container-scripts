{{- $name := printf "%s-secrets" (include "aiserver.fullname" .) }}
{{- $needsDb := not .Values.global.database.existingSecret }}
{{- $needsAuth := not .Values.auth.existingSecret }}
{{- if or $needsDb $needsAuth }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $clientSecret := .Values.auth.serverClientSecret }}
{{- if and $needsAuth (not $clientSecret) }}
  {{- if and $existing $existing.data (hasKey $existing.data "clientSecret") }}
    {{- $clientSecret = index $existing.data "clientSecret" | b64dec }}
  {{- else }}
    {{- $clientSecret = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "aiserver.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsDb }}
  database-password: {{ required "global.database.password must be set (or use global.database.existingSecret)" .Values.global.database.password | quote }}
  {{- end }}
  {{- if $needsAuth }}
  clientSecret: {{ $clientSecret | quote }}
  {{- end }}
{{- end }}
{{- if .Values.enabled }}
{{- $secretName := printf "%s-secrets" (include "extraction-monitor.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "extraction-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.global.database.existingSecret }}
  database-password: {{ .Values.global.database.password | quote }}
  {{- end }}
  {{- if not .Values.auth.existingServerClientSecret }}
  {{- if .Values.auth.serverClientSecret }}
  extraction-client-secret: {{ .Values.auth.serverClientSecret | quote }}
  {{- else if and $existing (index $existing.data "extraction-client-secret") }}
  extraction-client-secret: {{ index $existing.data "extraction-client-secret" | b64dec | quote }}
  {{- else }}
  extraction-client-secret: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
{{- end }}
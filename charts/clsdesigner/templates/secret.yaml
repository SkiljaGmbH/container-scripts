{{- $name := printf "%s-secrets" (include "classification-designer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $clientSecret := .Values.auth.serverClientSecret }}
{{- if not $clientSecret }}
  {{- if and $existing $existing.data (hasKey $existing.data "classification-client-secret") }}
    {{- $clientSecret = index $existing.data "classification-client-secret" | b64dec }}
  {{- else }}
    {{- $clientSecret = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "classification-designer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.global.database.existingSecret }}
  database-password: {{ .Values.global.database.password | quote }}
  {{- end }}
  {{- if not .Values.auth.existingServerClientSecret }}
  classification-client-secret: {{ $clientSecret | quote }}
  {{- end }}
  {{- if and .Values.ocr.microsoftReadOCRApiKey (not .Values.ocr.existingMicrosoftReadOCRApiKeySecret) }}
  microsoft-read-ocr-api-key: {{ .Values.ocr.microsoftReadOCRApiKey | quote }}
  {{- end }}
  classification-license: {{ .Values.env.license | quote }}
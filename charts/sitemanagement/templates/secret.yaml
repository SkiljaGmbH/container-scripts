apiVersion: v1
kind: Secret
metadata:
  name: {{ include "site-management-tool.fullname" . }}-secrets
  labels:
    {{- include "site-management-tool.labels" . | nindent 4 }}
type: Opaque
stringData:
  # -- Classification Service (CLSSERVICE_) - no USESSL/TRUSTCERTIFICATE per docs --
  CLSSERVICE_CLSSDATABASESERVERTYPE: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationService.serverType "fallback" .Values.global.database.serverType) | quote }}
  CLSSERVICE_CLSSDATABASESERVER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationService.server "fallback" .Values.global.database.server) | quote }}
  CLSSERVICE_CLSSDATABASENAME: {{ .Values.modules.classificationService.databaseName | quote }}
  CLSSERVICE_CLSSUSEINTEGRATEDSECURITY: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationService.useIntegratedSecurity "fallback" .Values.global.database.useIntegratedSecurity) | quote }}
  CLSSERVICE_CLSSSQLUSER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationService.user "fallback" .Values.global.database.user) | quote }}
  {{- if not .Values.global.database.existingSecret }}
  CLSSERVICE_CLSSSQLPASSWORD: {{ .Values.global.database.password | quote }}
  {{- end }}
  CLSSERVICE_HASAUTHENABLED: "true"

  # -- Classification Designer (CLSDESIGNER_) --
  CLSDESIGNER_DATABASESERVERTYPE: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationDesigner.serverType "fallback" .Values.global.database.serverType) | quote }}
  CLSDESIGNER_DATABASESERVER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationDesigner.server "fallback" .Values.global.database.server) | quote }}
  CLSDESIGNER_DATABASENAME: {{ .Values.modules.classificationDesigner.databaseName | quote }}
  CLSDESIGNER_USEINTEGRATEDSECURITY: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationDesigner.useIntegratedSecurity "fallback" .Values.global.database.useIntegratedSecurity) | quote }}
  CLSDESIGNER_SQLUSER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationDesigner.user "fallback" .Values.global.database.user) | quote }}
  {{- if not .Values.global.database.existingSecret }}
  CLSDESIGNER_SQLPASSWORD: {{ .Values.global.database.password | quote }}
  {{- end }}
  CLSDESIGNER_USESSL: {{ .Values.modules.classificationDesigner.useSSL | quote }}
  CLSDESIGNER_TRUSTCERTIFICATE: {{ .Values.modules.classificationDesigner.trustCertificate | quote }}
  CLSDESIGNER_HASAUTHENABLED: "true"

  # -- Online Classification Monitor (OLCLS_) --
  OLCLS_OLDATABASESERVERTYPE: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationMonitor.serverType "fallback" .Values.global.database.serverType) | quote }}
  OLCLS_OLDATABASESERVER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationMonitor.server "fallback" .Values.global.database.server) | quote }}
  OLCLS_OLDATABASENAME: {{ .Values.modules.classificationMonitor.databaseName | quote }}
  OLCLS_OLUSEINTEGRATEDSECURITY: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationMonitor.useIntegratedSecurity "fallback" .Values.global.database.useIntegratedSecurity) | quote }}
  OLCLS_OLSQLUSER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.classificationMonitor.user "fallback" .Values.global.database.user) | quote }}
  {{- if not .Values.global.database.existingSecret }}
  OLCLS_OLSQLPASSWORD: {{ .Values.global.database.password | quote }}
  {{- end }}
  OLCLS_OLUSESSL: {{ .Values.modules.classificationMonitor.useSSL | quote }}
  OLCLS_OLTRUSTCERTIFICATE: {{ .Values.modules.classificationMonitor.trustCertificate | quote }}

  # -- Extraction Service (EXTRSERVICE_) - no USESSL/TRUSTCERTIFICATE per docs --
  EXTRSERVICE_EXTRSDATABASESERVERTYPE: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionService.serverType "fallback" .Values.global.database.serverType) | quote }}
  EXTRSERVICE_EXTRSDATABASESERVER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionService.server "fallback" .Values.global.database.server) | quote }}
  EXTRSERVICE_EXTRSDATABASENAME: {{ .Values.modules.extractionService.databaseName | quote }}
  EXTRSERVICE_EXTRSUSEINTEGRATEDSECURITY: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionService.useIntegratedSecurity "fallback" .Values.global.database.useIntegratedSecurity) | quote }}
  EXTRSERVICE_EXTRSSQLUSER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionService.user "fallback" .Values.global.database.user) | quote }}
  {{- if not .Values.global.database.existingSecret }}
  EXTRSERVICE_EXTRSSQLPASSWORD: {{ .Values.global.database.password | quote }}
  {{- end }}
  EXTRSERVICE_HASAUTHENABLED: "true"

  # -- Extraction Designer (EXTRDESIGNER_) --
  EXTRDESIGNER_DATABASESERVERTYPE: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionDesigner.serverType "fallback" .Values.global.database.serverType) | quote }}
  EXTRDESIGNER_DATABASESERVER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionDesigner.server "fallback" .Values.global.database.server) | quote }}
  EXTRDESIGNER_DATABASENAME: {{ .Values.modules.extractionDesigner.databaseName | quote }}
  EXTRDESIGNER_USEINTEGRATEDSECURITY: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionDesigner.useIntegratedSecurity "fallback" .Values.global.database.useIntegratedSecurity) | quote }}
  EXTRDESIGNER_SQLUSER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionDesigner.user "fallback" .Values.global.database.user) | quote }}
  {{- if not .Values.global.database.existingSecret }}
  EXTRDESIGNER_SQLPASSWORD: {{ .Values.global.database.password | quote }}
  {{- end }}
  EXTRDESIGNER_USESSL: {{ .Values.modules.extractionDesigner.useSSL | quote }}
  EXTRDESIGNER_TRUSTCERTIFICATE: {{ .Values.modules.extractionDesigner.trustCertificate | quote }}
  EXTRDESIGNER_HASAUTHENABLED: "true"

  # -- Online Extraction Monitor (OLEXTR_) --
  OLEXTR_OLDATABASESERVERTYPE: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionMonitor.serverType "fallback" .Values.global.database.serverType) | quote }}
  OLEXTR_OLDATABASESERVER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionMonitor.server "fallback" .Values.global.database.server) | quote }}
  OLEXTR_OLDATABASENAME: {{ .Values.modules.extractionMonitor.databaseName | quote }}
  OLEXTR_OLUSEINTEGRATEDSECURITY: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionMonitor.useIntegratedSecurity "fallback" .Values.global.database.useIntegratedSecurity) | quote }}
  OLEXTR_OLSQLUSER: {{ include "site-management-tool.pick" (dict "override" .Values.modules.extractionMonitor.user "fallback" .Values.global.database.user) | quote }}
  {{- if not .Values.global.database.existingSecret }}
  OLEXTR_OLSQLPASSWORD: {{ .Values.global.database.password | quote }}
  {{- end }}
  OLEXTR_OLUSESSL: {{ .Values.modules.extractionMonitor.useSSL | quote }}
  OLEXTR_OLTRUSTCERTIFICATE: {{ .Values.modules.extractionMonitor.trustCertificate | quote }}

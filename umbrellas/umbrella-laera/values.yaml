# ---------------------------------------------------------------
# 6. Site Management Tool (one-time admin CLI, creates only a Secret)
# ---------------------------------------------------------------
site-management-tool:
  enabled: true     # creates only a Secret with the DB connection variables, no running workload
  # Interactive CLI to grant initial rights (license managers, organization admins, organizations).
  # Needed once after the first install, and again after adding a module. It only works after the
  # module pods were Ready once (their first start creates the databases).
  #
  # The step-by-step commands (CLI pod manifest with the correct Secret name and namespace) are
  # printed after helm install / upgrade. Show them again with:
  #   helm get notes <release> -n <ns>
  #
  # DB settings are inherited from global.database. Only override
  # modules.<name>.databaseName here if a module uses a non-default database.
  # Existing secret (global.database.existingSecret): it needs the six keys CLSSERVICE_CLSSSQLPASSWORD,
  # CLSDESIGNER_SQLPASSWORD, OLCLS_OLSQLPASSWORD, EXTRSERVICE_EXTRSSQLPASSWORD,
  # EXTRDESIGNER_SQLPASSWORD, OLEXTR_OLSQLPASSWORD in addition to 'database-password'.
